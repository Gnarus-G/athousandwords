[package]
name = "athousandwords"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A local visual communication companion for agents"

[[bin]]
name = "atw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "schemars"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
